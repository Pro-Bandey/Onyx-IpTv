name: DB Builder (IPTV Sync)

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every week on sunday
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Required to push to the 'db' branch

jobs:
  build-and-deploy-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (TV-Optimized Engine)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Run DB Parsing & Sharding Script
        run: npm run build:db

      - name: Deploy to 'db' branch (Zero-Bloat Strategy)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Move into the generated DB folder
          cd db
          
          # Initialize a fresh git repo to create an orphaned history
          git init
          git checkout -b db
          git add .
          git commit -m "Automated DB Sync: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          
          # Force push to overwrite the old db branch (prevents Git history bloating)
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db
