name: Generate Filtered IPTV Database

on:
  schedule:
    # Runs automatically every 7 days at midnight UTC
    - cron: '0 0 */7 * *'
  workflow_dispatch:
    # Allows you to trigger the compile manually from GitHub UI

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Database
        run: node build.js

      - name: Deploy output to db branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: db # The branch to push db.min.json to
          folder: dist # Deploys only files inside /dist folder
          clean: true # Ensures only current files remain on the db branch
          commit-message: "chore: Auto-update curated database"
