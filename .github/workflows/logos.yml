name: Logo Optimizer Pipeline (Free Image CDN)

on:
  schedule:
    - cron: "30 0 * * 1,4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (main)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout db branch
        uses: actions/checkout@v4
        with:
          ref: db
          path: db

      - name: Checkout logos branch (or create empty)
        uses: actions/checkout@v4
        with:
          ref: logos
          path: logos
        continue-on-error: true

      - name: Initialize missing logos branch (First Run Fix)
        run: |
          if [ ! -d "logos/.git" ]; then
            echo "Creating fresh logos branch..."
            mkdir -p logos
            cd logos
            git init
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -b logos
            echo "{}" > logos.json
            git add .
            git commit -m "chore: init empty logos branch [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git logos
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        working-directory: ./main-repo
        run: npm install

      - name: Run Logo Engine
        working-directory: ./main-repo
        run: npm run build:logos

      - name: Deploy incremental updates to logos branch
        run: |
          cd logos
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .

          # Only commit and push if new logos were downloaded
          if ! git diff-index --quiet HEAD; then
            git commit -m "latest iptv database logos Optimize & fetched - [skip ci]"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git logos
          else
            echo "✅ No new logos to commit. Everything is up to date."
          fi
