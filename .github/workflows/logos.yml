name: Logo Optimizer Pipeline (Free Image CDN)

on:
  schedule:
    - cron: '0 1 * * 1,4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-logos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scripts (main)
        uses: actions/checkout@v4
        with:
          path: main-repo

      - name: Checkout db branch
        uses: actions/checkout@v4
        with:
          ref: db
          path: db-data

      - name: Checkout logos branch (or create empty)
        uses: actions/checkout@v4
        with:
          ref: logos
          path: logos
        continue-on-error: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: main-repo/package-lock.json

      - name: Install Dependencies
        working-directory: ./main-repo
        run: npm install

      - name: Run Logo Engine
        working-directory: ./main-repo
        run: npm run build:logos

      - name: Deploy to logos branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: logos
          folder: logos
          clean: false
          commit-message: "chore(logos): incremental WebP logo optimization"