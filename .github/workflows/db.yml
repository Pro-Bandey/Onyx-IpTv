name: DB Builder Pipeline (Free IPTV Sync)

on:
  schedule:
    - cron: "0 0 * * 1,4" # Monday and Thursday at 12 AM
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build-db:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Dependencies
        run: npm install

      - name: Run DB Generator Script
        run: npm run build:db

      - name: Deploy cleanly to db branch via Native Git
        run: |
          cd db
          git init
          git config user.name "Core Flow Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b db
          git add .
          git commit -m "latest iptv database sync & fetched - [skip ci]"
          # Force push keeps the branch size incredibly small (1 commit history)
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git db
